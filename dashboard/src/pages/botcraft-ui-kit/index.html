<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>BotCraft — AI Avatar Content Studio</title>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <link rel="icon" href="../../assets/logo.svg"/>
  <link rel="stylesheet" href="../../colors_and_type.css"/>
  <style>
    html, body { margin:0; padding:0; background: var(--bg); color: var(--text); font-family: var(--font-body); }
    * { box-sizing: border-box; }
    button { font-family: var(--font-body); }
    button:active { transform: scale(0.98); }
    @keyframes bcPulse { 0%,100% { opacity: 1 } 50% { opacity: 0.55 } }
    @keyframes bcRing { 0%,100% { box-shadow: 0 0 0 0 rgba(167,139,250,0.45) } 50% { box-shadow: 0 0 0 6px rgba(167,139,250,0) } }
    @keyframes bcDrift {
      0%,100% { transform: translate(0,0) scale(1) }
      50% { transform: translate(20px,-30px) scale(1.08) }
    }
    @keyframes bcSlide { from { transform: translateY(-12px); opacity: 0 } to { transform: translateY(0); opacity: 1 } }
    @keyframes bcFadeUp { from { transform: translateY(8px); opacity: 0 } to { transform: translateY(0); opacity: 1 } }
    @keyframes bcShimmer { 0% { background-position: 200% 0 } 100% { background-position: -200% 0 } }
    main > * { animation: bcFadeUp 280ms cubic-bezier(0.22,1,0.36,1) }
    [dir="rtl"] .bc-flip { transform: scaleX(-1); }
    ::selection { background: rgba(167,139,250,0.3) }
    ::-webkit-scrollbar { width: 10px; height: 10px }
    ::-webkit-scrollbar-track { background: transparent }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; border: 2px solid var(--bg) }
    ::-webkit-scrollbar-thumb:hover { background: var(--border-strong) }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="mock.js"></script>
  <script type="text/babel" src="Primitives.jsx"></script>
  <script type="text/babel" src="Sidebar.jsx"></script>
  <script type="text/babel" src="Topbar.jsx"></script>
  <script type="text/babel" src="LoginScreen.jsx"></script>
  <script type="text/babel" src="Dashboard.jsx"></script>
  <script type="text/babel" src="AvatarsPage.jsx"></script>
  <script type="text/babel" src="VideosPage.jsx"></script>
  <script type="text/babel" src="PlaceholderPage.jsx"></script>
  <script type="text/babel" src="NewAvatar.jsx"></script>
  <script type="text/babel" src="AvatarDetail.jsx"></script>
  <script type="text/babel" src="Pages.jsx"></script>
  <script type="text/babel" src="App.jsx"></script>
</body>
</html>
