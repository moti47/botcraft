version: "3.9"

# כל השירותים על אותה רשת — שמות הקונטיינרים עובדים כ-DNS פנימי
networks:
  viral_empire_net:
    driver: bridge

volumes:
  redis_data:
  n8n_data:
  postgres_data:

services:

  # ---------------------------------------------------------------
  # Postgres — משמש את n8n בלבד (אנחנו נשארים על Supabase ל-app data)
  # ---------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: viral_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=n8n
      - POSTGRES_PASSWORD=n8n
      - POSTGRES_DB=n8n
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - viral_empire_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------
  # Redis — תור ה-jobs של ה-worker + rate limiter
  # ---------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: viral_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - viral_empire_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ---------------------------------------------------------------
  # FastAPI — ה-backend הראשי. ה-worker רץ כשירות נפרד למטה.
  # ---------------------------------------------------------------
  fastapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: viral_fastapi
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
      # ה-API לא מריץ worker בתוך עצמו — יש לכך שירות נפרד
      - VIDEO_WORKER_ENABLED=false
    volumes:
      - ./app:/code/app
      - ./core:/code/core
      - ./services:/code/services
      - ./tasks:/code/tasks
    networks:
      - viral_empire_net
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=3).status==200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ---------------------------------------------------------------
  # Worker — מריץ את tasks/video_worker.py מול תור Redis
  # ---------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: viral_worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./app:/code/app
      - ./core:/code/core
      - ./services:/code/services
      - ./tasks:/code/tasks
    networks:
      - viral_empire_net
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      # ה-worker לא חושף HTTP — בודק שהתהליך רץ דרך /proc
      test: ["CMD-SHELL", "cat /proc/1/cmdline | grep -q video_worker || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    command: python -u -m tasks.video_worker

  # ---------------------------------------------------------------
  # n8n — מריץ את ארבעת ה-workflows שנמצאים תחת n8n_workflows/
  # ---------------------------------------------------------------
  n8n:
    image: n8nio/n8n:latest
    container_name: viral_n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Asia/Jerusalem
      - N8N_SECURE_COOKIE=false
      # n8n persistence ב-Postgres כדי שלא נאבד workflows בריסטרט
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=n8n
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n_workflows:/home/node/n8n_workflows:ro
    networks:
      - viral_empire_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      fastapi:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------
  # Dashboard — React + Vite UI for the whole system
  # ---------------------------------------------------------------
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: viral_dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://fastapi:8000
    networks:
      - viral_empire_net
    depends_on:
      - fastapi
